openapi: 3.0.3
info:
  title: hookscan serve API
  description: >
    Local API served by `hookscan serve` on 127.0.0.1:8787. /api/scan and
    /api/links are read-only and offline; /api/urlscan makes outbound requests
    (the target page, dns.google, ipwho.is, crt.sh).
  version: 0.2.0
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, example: true }
  /api/scan:
    get:
      summary: Input-capture audit of this host (same as `hookscan --json`)
      operationId: scanHost
      responses:
        '200':
          description: Scan report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanReport' }
        '500':
          description: Scan failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/links:
    get:
      summary: Offline URL heuristic scan (nothing is fetched)
      operationId: scanLinks
      parameters:
        - name: urls
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
            maxItems: 32
          example: ["https://xn--pypal-4ve.com/login"]
      responses:
        '200':
          description: One verdict per URL
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LinkResult' }
        '400':
          description: Missing or empty urls parameter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/urlscan:
    get:
      summary: urlscan.io-style report (makes outbound requests)
      operationId: scanUrl
      description: >
        Fetches the target page and queries dns.google, ipwho.is and crt.sh.
        Every source failure is recorded in `errors`; a slow API yields a
        partial report, not an error.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string }
          example: https://example.com
      responses:
        '200':
          description: urlscan-style report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlscanReport' }
        '400':
          description: Missing or empty url parameter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Finding:
      type: object
      required: [severity, rule, detail]
      properties:
        severity: { type: string, enum: [info, low, medium, high] }
        rule: { type: string }
        detail: { type: string }
    LinkResult:
      type: object
      required: [url, verdict, findings]
      properties:
        url: { type: string }
        verdict: { type: string, enum: [clean, suspicious, malicious] }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
    ScanReport:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
    UrlscanReport:
      type: object
      required: [url, host, verdict, page, dns, screenshot_url, errors]
      properties:
        url: { type: string }
        host: { type: string }
        scanned_at: { type: string, example: "2026-11-24T14:37:59Z" }
        verdict: { type: string, enum: [clean, suspicious, malicious] }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        page:
          type: object
          properties:
            status: { type: integer, nullable: true }
            final_url: { type: string }
            title: { type: string, nullable: true }
            server: { type: string, nullable: true }
            content_type: { type: string, nullable: true }
            bytes_read: { type: integer }
        dns:
          type: object
          properties:
            records:
              type: array
              items:
                type: object
                required: [type, name, data]
                properties:
                  type: { type: string, enum: [A, AAAA, MX] }
                  name: { type: string }
                  data: { type: string }
        ip_info:
          nullable: true
          type: object
          properties:
            ip: { type: string }
            country: { type: string }
            country_code: { type: string }
            city: { type: string }
            asn: { type: integer }
            org: { type: string }
            isp: { type: string }
        cert:
          nullable: true
          type: object
          properties:
            issuer: { type: string }
            common_name: { type: string }
            not_before: { type: string }
            not_after: { type: string }
        screenshot_url: { type: string }
        errors:
          type: array
          items: { type: string }
